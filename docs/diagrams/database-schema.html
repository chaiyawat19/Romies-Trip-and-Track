  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;

      max-width: 1240px;
      width: 100%;
      background: #ffffff;
      padding: 2.5rem;

      border: 1px solid rgba(30, 34, 41, 0.08);
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.5vw + 1rem, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subhead {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 2rem;
      max-width: 800px;
      line-height: 1.5;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }
